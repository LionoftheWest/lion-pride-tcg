<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* --- rarity accent is swapped per card via the .card data attributes --- */
  :root { --accent:#f59e0b; --accent-soft:#fde68a; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:500px; height:700px; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#05060a; }

  .card {
    width:500px; height:700px; padding:18px;
    background: radial-gradient(130% 90% at 50% -10%, #1c2434 0%, #0a0d14 62%);
    border:7px solid var(--accent);
    border-radius:30px;
    box-shadow: inset 0 0 46px rgba(0,0,0,.65), 0 0 0 2px rgba(0,0,0,.5);
    display:flex; flex-direction:column; gap:12px;
    position:relative; overflow:hidden;
  }
  /* diagonal foil sheen */
  .card::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(130deg, transparent 42%, rgba(255,255,255,.07) 50%, transparent 58%);
  }

  .titlebar { display:flex; justify-content:space-between; align-items:center; }
  .name {
    font-size:30px; font-weight:800; color:#fff; letter-spacing:.3px;
    text-shadow:0 2px 8px rgba(0,0,0,.7);
  }
  .pip {
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px; font-weight:800;
    color:#0a0d14; background:var(--accent);
    padding:5px 11px; border-radius:999px; white-space:nowrap;
    box-shadow:0 0 14px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  .subject { font-size:12px; color:var(--accent-soft); letter-spacing:2px; text-transform:uppercase; }

  .art {
    flex:1 1 auto; border-radius:18px; overflow:hidden;
    border:2px solid rgba(255,255,255,.09);
    background:linear-gradient(135deg,#2a3348,#121826);
    display:flex; align-items:center; justify-content:center;
    color:#3d4860; font-size:16px; letter-spacing:3px;
  }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }

  .lore {
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08);
    border-radius:14px; padding:12px 15px; min-height:88px;
    color:#cbd3e1; font-family:Georgia,'Times New Roman',serif;
    font-style:italic; font-size:15px; line-height:1.4;
  }

  .footer { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#79839a; }
  .finish { color:var(--accent); font-weight:800; letter-spacing:.6px; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <div class="name">Ember Fox</div>
      <div class="pip">Gold</div>
    </div>
    <div class="subject">Inside joke • Season 1</div>
    <div class="art"><!-- <img src="art.png"> -->ART</div>
    <div class="lore">“It naps in warm ash and wakes with a spark.”</div>
    <div class="footer">
      <span class="finish">Gold finish</span>
      <span>Art by Placeholder</span>
    </div>
  </div>
</body>
</html>
