<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Lion Pride TCG - Admin</title>
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="stylesheet" href="/admin/editors.css" />
  <link rel="stylesheet" href="/admin/lab.css" />
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/overview">Lion Pride TCG - Admin</a>
    <form class="gsearch" id="gsearch" role="search" autocomplete="off">
      <span class="ico" data-icon="search"></span>
      <input id="gsearch-input" type="search" placeholder="Search members, cards, tables" aria-label="Search members, cards, tables" />
      <kbd class="kbd">Ctrl K</kbd>
      <div class="gsearch-results" id="gsearch-results" hidden></div>
    </form>
    <div class="top-right">
      <span class="top-label hide-phone">Data source</span>
      <span class="source" id="source" aria-live="polite"><span class="ico" data-icon="database"></span><span id="source-text">...</span></span>
      <div class="refresh-at hide-phone"><span class="lbl">Last refresh</span><span class="num" id="refresh-at">-</span></div>
      <button class="btn" id="refresh" type="button" aria-label="Refresh"><span class="ico" data-icon="refresh"></span><span class="hide-phone">Refresh</span></button>
      <button class="btn icon-only show-phone" id="search-open" type="button" aria-label="Search"><span class="ico" data-icon="search"></span></button>
    </div>
  </header>
  <nav class="side" id="side" aria-label="Admin sections"></nav>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Admin sections"></nav>
  <div class="sheet-back" id="sheet-back" hidden></div>
  <div class="sheet" id="more-sheet" role="dialog" aria-modal="true" aria-label="More sections" hidden></div>
</body>
</html>
