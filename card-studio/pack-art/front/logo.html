<!doctype html><html><head><style>
/* The Lion Pride TCG lockup C (the emblem, LION PRIDE, the TCG tag), made from the app's own
   font, emblem SVG and color tokens (tcg-activity/public). logo.py screenshots #logo. */
@font-face{font-family:'Bricolage Grotesque';src:url('../../../tcg-activity/public/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');font-weight:200 800}
html,body{margin:0;background:transparent}
.l{display:inline-flex;align-items:center;gap:22px;font:800 96px 'Bricolage Grotesque';letter-spacing:1.4px;padding:30px}
.e{width:182px;height:182px;border-radius:53px;display:grid;place-items:center;background:linear-gradient(180deg,#FFD76E,#E0971C);border:5px solid #FFE7A866;box-shadow:0 18px 60px rgba(244,183,60,.35)}
.e img{width:130px;height:130px}
b{color:#F5F2EC}b.g{color:#F4B73C;margin-left:-10px}
i{font:800 52px 'Bricolage Grotesque';font-style:normal;letter-spacing:3px;color:#1C1203;background:#F4B73C;border-radius:24px;padding:14px 28px}
</style></head><body>
<div id="logo" class="l"><span class="e"><img src="../../../tcg-activity/public/logo-lion.svg"></span><b>LION</b><b class="g">PRIDE</b><i>TCG</i></div>
</body></html>
