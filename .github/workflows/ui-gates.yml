# The UI gates G1, G3 and G4 of the UI standard (docs/design.md 12.5). Scripts and scope: ci/README.md.
# G1 and G4 run on every PR. G3 runs only when the PR changes a file in the UI scope
# (ci/gates/scope.json) or the check itself, on the screens of ci/ui-check/plan.mjs; "G3 UI check" always reports.
name: UI gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ui-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  g1:
    name: G1 Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the gate scripts
        run: node --test ci/gates/gates.test.mjs ci/ui-check/evaluate.test.mjs
      - name: G1 Register
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/gates/g1-register.mjs

  g4:
    name: G4 Literal counter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: G4 Literal counter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/gates/g4-literals.mjs

  plan:
    name: G3 plan
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.plan.outputs.ui }}
      run: ${{ steps.plan.outputs.run }}
      screens: ${{ steps.plan.outputs.screens }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/ui-check/plan.mjs >> "$GITHUB_OUTPUT"

  # 6 jobs for each browser (--shard k/6: every 6th cell), 4 cells at a time in each job (a runner has 4 cores). All
  # shards together run every cell; the verdict job merges the g3-* artifacts. One job ran 764 cells in 76 min (2026-10-07).
  # The plan names the screens:
  # the screens of the enforced IDs, or every screen for the shell IDs and for a change to the check itself.
  g3-run:
    name: G3 run (${{ matrix.browser }} ${{ matrix.shard }}/6)
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A shard takes 10-22 min (2026-10-07). A hung job stops at 45 min, not 120.
    timeout-minutes: 45
    # The official Playwright image of the version in ci/ui-check/package.json: the browsers and their system
    # libraries are in it. The old step ran "playwright install --with-deps" (apt-get) on every runner, and on
    # 2026-10-08 both 8-minute tries timed out in 3 runs (#285, #278, #277). Change the tag with the package version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tcg-activity/package-lock.json
            ci/ui-check/package-lock.json
      - name: Install
        timeout-minutes: 10
        run: |
          npm ci --prefix tcg-activity --no-audit --no-fund
          npm ci --prefix ci/ui-check --no-audit --no-fund
      - name: Build the client (SDK stub, fixtures)
        run: node ci/ui-check/build.mjs
      - name: Run the screens
        env:
          SCREENS: ${{ needs.plan.outputs.screens }}
        run: node ci/ui-check/run.mjs --browser ${{ matrix.browser }} --screens "$SCREENS" --workers 4 --shard ${{ matrix.shard }}/6 --out ci/ui-check/.out/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-${{ matrix.browser }}-${{ matrix.shard }}
          path: ci/ui-check/.out/results
          retention-days: 14
          if-no-files-found: warn

  g3:
    name: G3 UI check
    needs: [plan, g3-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Not a UI PR
        if: needs.plan.outputs.ui != 'true'
        run: |
          echo "### G3 UI check: PASS (not run: no file in the UI scope changed)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.run == 'true'
        with:
          pattern: g3-*
          path: ci/ui-check/.out/results
          merge-multiple: true
      - name: G3 verdict
        if: needs.plan.outputs.ui == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SCREENS: ${{ needs.plan.outputs.screens }}
        run: |
          mkdir -p ci/ui-check/.out/results
          node ci/ui-check/evaluate.mjs --results ci/ui-check/.out/results --screens "$SCREENS"
      - uses: actions/upload-artifact@v4
        if: always() && needs.plan.outputs.ui == 'true'
        with:
          name: g3-results
          path: ci/ui-check/.out/results/defects.json
          retention-days: 14
