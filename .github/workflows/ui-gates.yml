# The UI gates G1, G3 and G4 of the UI standard (docs/design.md 12.5). Scripts and scope: ci/README.md.
# G1 and G4 run on every PR. G3 runs its matrix only when the PR changes a file in the UI scope
# (ci/gates/scope.json) or the check itself; the job "G3 UI check" always reports the verdict.
name: UI gates

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ui-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  g1:
    name: G1 Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the gate scripts
        run: node --test ci/gates/gates.test.mjs ci/ui-check/evaluate.test.mjs
      - name: G1 Register
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/gates/g1-register.mjs

  g4:
    name: G4 Literal counter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: G4 Literal counter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/gates/g4-literals.mjs

  scope:
    name: G3 scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci/ui-check/scope.mjs >> "$GITHUB_OUTPUT"

  g3-run:
    name: G3 run (${{ matrix.browser }} ${{ matrix.size }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        size: [375x667, 667x375, 430x932, 932x430, 430x822, 412x915, 915x412, 820x1180, 1180x820, 692x917, 917x692, 1280x720, 1990x830, 1280x480, 400x225]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tcg-activity/package-lock.json
            ci/ui-check/package-lock.json
      - name: Install
        run: |
          npm ci --prefix tcg-activity --no-audit --no-fund
          npm ci --prefix ci/ui-check --no-audit --no-fund
          (cd ci/ui-check && npx playwright install --with-deps ${{ matrix.browser }})
      - name: Build the client (SDK stub, fixtures)
        run: node ci/ui-check/build.mjs
      - name: Run the screens
        run: node ci/ui-check/run.mjs --browser ${{ matrix.browser }} --sizes ${{ matrix.size }} --out ci/ui-check/.out/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-${{ matrix.browser }}-${{ matrix.size }}
          path: ci/ui-check/.out/results
          retention-days: 14
          if-no-files-found: warn

  g3:
    name: G3 UI check
    needs: [scope, g3-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Not a UI PR
        if: needs.scope.outputs.run != 'true'
        run: |
          echo "### G3 UI check: PASS (not run: no file in the UI scope changed)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.run == 'true'
        with:
          pattern: g3-*
          path: ci/ui-check/.out/results
          merge-multiple: true
      - name: G3 verdict
        if: needs.scope.outputs.run == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node ci/ui-check/evaluate.mjs --results ci/ui-check/.out/results
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.run == 'true'
        with:
          name: g3-results
          path: ci/ui-check/.out/results/defects.json
          retention-days: 14
