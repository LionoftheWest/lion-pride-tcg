# Copy of the live file /home/ubuntu/cloudflared/config.yml on the main VM.
# The Discord proxy reaches the Activity through this named tunnel (container cf-named).
# The credentials file and cert.pem are secrets. They stay on the VM only.
tunnel: ac54ed9b-12b8-4433-b4d6-bf9ca5bed3b3
credentials-file: /home/nonroot/.cloudflared/ac54ed9b-12b8-4433-b4d6-bf9ca5bed3b3.json
ingress:
  - hostname: play.lionpridetcg.com
    service: https://localhost:443
    originRequest:
      httpHostHeader: lionpridetcg.duckdns.org
      originServerName: lionpridetcg.duckdns.org
  - service: http_status:404
