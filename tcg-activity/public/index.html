<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lion Pride TCG</title>
  <link rel="stylesheet" href="/style.css?v=__CSSV__" />
  <link rel="stylesheet" href="/ui-v2.css" />
  <link rel="stylesheet" href="/ui-v2-screens.css" />
  <link rel="stylesheet" href="/ui-v2-squad.css" />
  <link rel="stylesheet" href="/ui-v2-round2.css" />
  <link rel="stylesheet" href="/ui-v2-member.css" />
  <link rel="stylesheet" href="/ui-v2-social.css" />
  <link rel="stylesheet" href="/ui-v2-round3.css" />
  <link rel="stylesheet" href="/ui-v2-open.css" />
  <link rel="stylesheet" href="/ui-v2-home.css" />
  <link rel="stylesheet" href="/ui-v2-fit.css" />
  <link rel="stylesheet" href="/ui-v2-tradefx.css" />
</head>
<body>
  <div id="loader">
    <div class="ldr">
      <div class="ldr-logo">🦁</div>
      <div class="ldr-title">LION PRIDE TCG</div>
      <div class="ldr-bar"><span></span></div>
      <div class="ldr-msg" id="loaderMsg">Entering the Pride…</div>
    </div>
  </div>
  <header id="topbar">
    <div class="title"><span class="logo">🦁</span> <span class="v2-name">Lion Pride TCG</span><span class="v2-logo v2-only"><span class="v2-emblem"><img src="/logo-lion.svg" alt=""></span><b>LION</b><b class="gold">PRIDE</b><i>TCG</i></span><span class="v2-season v2-only" id="v2Season"></span></div>
    <button id="openTop" class="open-top hidden">🎴 Open Pack</button>
    <div class="topright">
      <span class="v2-pill v2-only" id="v2Packs" title="Packs to open"></span>
      <button id="dailyBtn" class="iconbtn hidden" title="Dailies">📅</button>
      <button id="helpBtn" class="iconbtn hidden" title="Help">?</button>
      <button id="reportBtn" class="iconbtn hidden" title="Report a problem">🔧</button>
      <button id="bellBtn" class="iconbtn hidden" title="Notifications">🔔</button>
      <button id="boardBtn" class="iconbtn hidden" title="Leaderboard">🏆</button>
      <button id="giftBtn" class="iconbtn hidden" title="Gift a pack">🎁</button>
      <button id="mute" class="iconbtn hidden" title="Sound on/off">🔊</button>
      <span class="v2-avatar v2-only" id="v2Avatar"></span>
      <nav id="nav" class="hidden">
        <button data-view="gallery">Gallery</button>
        <button data-view="trading">Trading</button>
        <button data-view="collection" class="active">Collection</button>
        <button data-view="battling">Battling</button>
      </nav>
    </div>
  </header>
  <div id="status">Loading…</div>
  <div id="body" class="hidden">
    <main id="main"></main>
    <aside id="feed">
      <div id="bossMini"></div>
      <div class="feed-head">Community Live Feed</div>
      <div class="feed-list" id="feedList"></div>
    </aside>
  </div>


  <!-- UI v2 dock (hidden unless body.ui-v2). -->
  <nav id="dock" aria-label="Main">
    <button class="dk" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="dk" data-view="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg><span>Collection</span></button>
    <button class="dk-open" id="dockOpen" title="Open a pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg><span>OPEN</span><i class="dk-badge" id="dockBadge"></i></button>
    <button class="dk" data-view="battling"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 17.5 5-5"/><path d="m3 3 11 11"/><path d="m21 3-11 11"/><path d="m9.5 17.5-5-5"/><path d="M3 21l3-3"/><path d="m21 21-3-3"/></svg><span>Hunt</span><i class="dot"></i></button>
    <button class="dk" data-view="trading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Community</span><i class="dot"></i></button>
  </nav>

  <!-- Full-screen pack-opening takeover: dims everything, plays the reveal. -->
  <div id="stage" class="hidden"></div>

  <!-- Gift a pack: find a player (in the VC or not) and send from your balance. -->
  <div id="gift" class="hidden"></div>

  <!-- Trade builder: pick a player, pick your card, gift it or request one back. -->
  <div id="trade" class="hidden"></div>

  <!-- In-app notifications (the bell). -->
  <div id="notif" class="hidden"></div>

  <!-- Leaderboard: top players by Total Collection Power (the trophy). -->
  <div id="board" class="hidden"></div>
  <div id="effectPick" class="hidden"></div>
  <div id="effectBanners"></div>

  <!-- Boss detail: click the mini boss square for the full view + stats + move pool. -->
  <div id="bossModal" class="hidden">
    <button id="bossModalClose" title="Close">✕</button>
    <div class="bm-card">
      <div class="bm-stage"><canvas id="bossModalCanvas"></canvas></div>
      <div class="bm-info" id="bossModalInfo"></div>
    </div>
  </div>

  <!-- 3D card viewer: drag to pivot, click to flip, holo shines on tilt. -->
  <div id="viewer" class="hidden">
    <button id="viewer-close" title="Close">✕</button>
    <div class="viewer-stage" id="viewer-stage">
      <div class="card3d" id="card3d">
        <div class="face front">
          <img id="v-front" alt="">
          <div class="holo"></div>
          <div class="glare"></div>
        </div>
        <div class="face back"><img id="v-back" alt="card back"></div>
      </div>
    </div>
    <div class="viewer-info">
      <div class="v-subject" id="v-subject"></div>
      <h3 id="v-name"></h3>
      <span class="badge" id="v-badge"></span>
      <div class="v-fields">
        <div><span class="v-label">Season</span><span id="v-season"></span></div>
        <div id="v-event-row" class="hidden"><span class="v-label">Event</span><span id="v-event"></span></div>
        <div><span class="v-label">Rarity</span><span id="v-rarity"></span></div>
      </div>
      <p class="v-lore" id="v-lore"></p>
      <p class="v-artist" id="v-artist"></p>
      <div id="v-raid" class="v-raid hidden"></div>
      <div id="v-ability" class="v-ability hidden">
        <div class="v-sec-head">Ability</div>
        <div class="v-ability-name" id="v-ability-name"></div>
        <div class="v-ability-desc" id="v-ability-desc"></div>
        <div class="v-ability-meta" id="v-ability-meta"></div>
      </div>
      <div id="v-effect" class="v-effect hidden"></div>
      <div id="v-tags" class="v-tags hidden">
        <div class="v-sec-head">Tags</div>
        <div class="v-tag-rows" id="v-tag-rows"></div>
      </div>
      <div id="v-asc" class="v-asc hidden">
        <div class="v-asc-line"><span class="v-stars" id="v-stars"></span><span class="v-power" id="v-power"></span></div>
        <button id="v-ascend" class="v-ascend hidden"></button>
        <div class="v-asc-note" id="v-asc-note"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/__BUNDLE__"></script>
</body>
</html>
